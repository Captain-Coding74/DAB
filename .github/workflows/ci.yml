name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# v21.31: a newer push to the same branch or PR cancels the run it supersedes.
# Never on main: a run there may be pushing the image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # 22, not 20: scripts/coverage.mjs uses --test-coverage-exclude, which does
  # not exist before Node 22 ("node: bad option"). Local dev runs 22.x, so this
  # also stops CI and the workstation drifting apart.
  NODE_VERSION: "22"

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # workspaces: the only lockfile is at the root
      - run: npm ci
      # routes.test.js asserts /welcome serves frontend/dist/landing.html, which
      # only exists after a Vite build (public/ -> dist/). dist/ is gitignored,
      # so without this the route 404s and the suite fails in CI while passing
      # locally on a stale build. Pre-existing since v20.4.1; CI never ran to
      # surface it until v21.
      - run: npm run build -w frontend
      - run: npm test -w backend
      - run: npm run test:integration -w backend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm            # workspaces: the only lockfile is at the root
      - run: npm ci
      # v21.30: THIRD_PARTY_NOTICES.md and /licenses/third-party.txt are
      # generated from package-lock.json and the installed packages. Fails
      # when they are stale (a dependency changed without `npm run licenses`)
      # or a production dependency's licence is outside the allow-list and
      # unreviewed. Here, not in quality-gates: it needs only `npm ci`, and a
      # failing browser suite must not hide it.
      - run: npm run licenses:check
      - run: npm test -w frontend
      - run: npm run build -w frontend

  e2e:
    name: E2E User Journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Real server, real HTTP, real SQLite, real PDF/XLSX. AI_MOCK=1 → no key needed.
      - run: npm run test:e2e

  # v21.31: this used to be one 3.5-minute job — browser suite, perf, coverage
  # (70 s on its own) and the audit (35 s) in series — that everything else
  # waited for. They now run side by side; the gate job below keeps the old
  # name, reads their metrics, and passes only when all three did.
  browser:
    name: Browser Suite + Perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # System libs Chromium needs. The browser binary itself ships inside the
      # @sparticuz/chromium npm package, so no browser-CDN access is required.
      - name: Chromium system libraries
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libcairo2

      - run: npm run build

      # Playwright over every critical user flow. Emits metrics/browser.json:
      # pass rate, durations, console errors, screenshots + traces on failure.
      - run: npm run test:browser

      - run: npm run perf:bundle          # initial payload, gzip
      - run: npm run perf:render          # LCP / analyze / client API p95
      # /api/analyze is CPU-bound and this runner is ~4x slower than the hardware
      # perf-budget.json was calibrated on. Scaled, not skipped: catches gross
      # regressions here, while the unscaled local run stays the tight gate.
      # See the comment block in backend/scripts/perf-api.mjs.
      - run: npm run perf:api -w backend
        env:
          PERF_CPU_FACTOR: "4"  # server p95 + throughput

      # One file per artifact, so it unpacks at a fixed path in the gate job.
      - uses: actions/upload-artifact@v4
        with:
          name: browser-metrics
          path: metrics/browser.json
      - name: Upload failure artifacts (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: artifacts/browser/
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w frontend    # the suites include /welcome (see backend-tests)
      - run: npm run coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-metrics
          path: metrics/coverage.json

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Dependency gating is `npm run audit:gate` (v15). Raw `npm audit` is
      # deliberately NOT used: it fails on dev-only tooling and on advisories
      # with no fix, which trains everyone to ignore the gate. See ADR-0008.
      - run: npm run audit:gate

  quality-gates:
    name: Browser Suite + Perf Budgets + Quality Gates
    runs-on: ubuntu-latest
    needs: [browser, coverage, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # quality.mjs and dashboard.mjs use only Node built-ins: no npm ci.
      - uses: actions/download-artifact@v4
        with:
          name: browser-metrics
          path: metrics
      - uses: actions/download-artifact@v4
        with:
          name: coverage-metrics
          path: metrics
      # Gates complexity, duplication, coverage, AND browser pass rate +
      # console errors from the two jobs above.
      - run: npm run quality
      - run: npm run dashboard

      - name: Upload cockpit (dashboard, history; failures are in browser-failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-cockpit
          path: |
            metrics/dashboard.html
            metrics/history.jsonl
            metrics/browser.json

  # v21.31: builds alongside the tests instead of after them (it needs none
  # of their output); Deploy still waits for every test job.
  # v21.32: for linux/amd64 AND linux/arm64 (Oracle's free Ampere A1 VMs are
  # Arm). npm ci and the Vite build run natively for both — the Dockerfile
  # cross-installs the arm64 dependencies — so QEMU only runs the runtime
  # stage's one RUN step (adduser, mkdir) and the smoke test below.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .              # workspaces: the lockfile is at the root
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: dab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The runner's Docker image store cannot take a two-platform image, so
      # each platform is loaded on its own. Same builder, same steps: both are
      # cache hits from the build above and cost only the export.
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dab:amd64
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/arm64
          load: true
          tags: dab:arm64
      # A build that succeeds can still ship an image that cannot open its
      # database: the arm64 libsql binary is installed, never loaded, at build
      # time. Boots each image (arm64 under QEMU) and sends it real requests.
      - run: scripts/docker-smoke.sh dab:amd64 linux/amd64
      - run: scripts/docker-smoke.sh dab:arm64 linux/arm64

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, e2e, quality-gates, docker-build]
    # Publishing is opt-in. docker/login-action fails with "Username and
    # password required" when DOCKERHUB_* are unset, which turned an
    # unconfigured publish target into a red pipeline. Secrets are NOT
    # available to a job-level `if`, so this gates on a repository VARIABLE:
    #   Settings -> Secrets and variables -> Actions
    #     Secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
    #     Variables: DEPLOY_ENABLED = true
    # Until that variable is set the job reports "skipped", which is the
    # truthful state — not configured, rather than broken.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      # v21.32: only needed if the cache below has been evicted — the runtime
      # stage's RUN step then has to run again for arm64.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .              # workspaces: the lockfile is at the root
          file: ./backend/Dockerfile
          # v21.32: one multi-platform manifest per tag — `docker pull` on an
          # Arm host (Oracle Ampere A1) gets the arm64 image, x86 gets amd64.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dab:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dab:${{ github.sha }}
          # v21.31: the layers Docker Build just cached — no second full build.
          cache-from: type=gha
