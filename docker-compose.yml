# v21.1: `minio` provides an S3-compatible endpoint so STORAGE_DRIVER=s3 can be
# exercised locally without an AWS or Cloudflare account. Production points
# S3_ENDPOINT at R2/S3 instead; nothing else changes.
#
# v21.30: no secret has a default any more. The file used to ship working
# passwords (dab / dabsecret123) for Postgres and MinIO, so every deployment
# that did not override them shared the same credentials — and MinIO's API
# and console were published on every network interface. Each secret is now
# ${VAR:?…}: `docker compose` refuses to start until it is set in .env (see
# .env.example for how to generate them), and MinIO listens on 127.0.0.1 only.
# Postgres and Redis are not published at all; the app reaches them on the
# private compose network, which is why DATABASE_URL says sslmode=disable.
version: '3.9'
services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
    - 3000:3000
    environment:
      NODE_ENV: production
      # This compose file publishes port 3000 straight from Node — no reverse
      # proxy in front — so X-Forwarded-For arrives from the client itself and
      # must NOT be trusted: with the app's back-compat default (1 hop) any
      # caller could forge the header, spoof req.ip, and walk past the
      # IP-keyed login brute-force limiter. 0 = trust nothing. If you put
      # nginx/Caddy/Traefik in front, set TRUST_PROXY=1 in .env.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}"
      DATABASE_URL: "postgresql://dab:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/dab?sslmode=disable"
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Optional: seals saved files with AES-256-GCM (see .env.example).
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      # v21.30: who runs DAB, as /privacy, /terms and /contact print it (PDPA
      # s.23) — production warns at boot while the contact details are empty.
      # Settings are passed one by one, so anything not listed here never
      # reaches the container; empty means "use the default" (.env.example).
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_POSTAL_ADDRESS: ${LEGAL_POSTAL_ADDRESS:-}
      LEGAL_HOSTING_PROVIDER: ${LEGAL_HOSTING_PROVIDER:-}
      LEGAL_HOSTING_REGION: ${LEGAL_HOSTING_REGION:-}
      # v21.30: retention periods in days; empty keeps the documented defaults.
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-}
      DATASET_RETENTION_DAYS: ${DATASET_RETENTION_DAYS:-}
      ANALYSIS_RETENTION_DAYS: ${ANALYSIS_RETENTION_DAYS:-}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-}
      ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-}
      PRIVACY_REQUEST_RETENTION_DAYS: ${PRIVACY_REQUEST_RETENTION_DAYS:-}
      TRAFFIC_LOG_RETENTION_DAYS: ${TRAFFIC_LOG_RETENTION_DAYS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-dab}
      # For the bundled MinIO, the same values as MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    # No dist bind-mount: the image builds the frontend and ships it at
    # /app/frontend/dist. The old mount pointed at /app/public, which app.js
    # never read, so the container served no UI.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dab
      POSTGRES_USER: dab
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
    - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U dab
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}"
    # Loopback only: reachable from this machine (or an SSH tunnel), not from
    # the network. The app talks to MinIO over the compose network instead.
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - minio-data:/data
volumes:
  pg-data: null
  redis-data: null
  minio-data: null
